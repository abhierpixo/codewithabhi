server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Vite emits content-hashed filenames (index-BJjIqA8J.js), so a given URL
    # can never change contents — cache it for a year.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # HTML shells must never be cached: they point at the hashed asset names,
    # so a stale copy would load a deleted bundle after a redeploy. This covers
    # the root shell, the prerendered per-route shells and the course lessons.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /sitemap.xml { add_header Cache-Control "no-cache"; }

    # The app uses real paths (/work, /work/:slug, /hire). The build prerenders
    # a shell with that page's own title, description and schema at
    # <route>/index.html, so a crawler gets page-specific metadata without
    # running JavaScript; anything else falls back to the root shell, which the
    # app then routes client-side. `$uri/index.html` rather than `$uri/` so a
    # request for /work serves the shell directly instead of a 301 to /work/.
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml application/xml;

    # the favicon is an inline data: URI in index.html, so a missing
    # /favicon.ico request is expected — don't fill the logs with it
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; }
}
