server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Vite emits content-hashed filenames (index-BJjIqA8J.js), so a given URL
    # can never change contents — cache it for a year.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # The shell must never be cached: it's what points at the hashed asset
    # names, so a stale copy would load a deleted bundle after a redeploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # The app uses hash routing (#/work, #/courses/:slug), which the browser
    # never sends to the server — so this fallback is only belt-and-braces for
    # stray paths. It also keeps things working if you ever move to history
    # routing for real URLs.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml application/xml;

    # the favicon is an inline data: URI in index.html, so a missing
    # /favicon.ico request is expected — don't fill the logs with it
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
}
